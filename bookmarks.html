<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmarks | Lazy Mochi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/public.css">
    <style>
        :root {
            --bg-dark: #000000;
            --card-bg: #121316;
            --card-hover: #1a1c21;
            --input-bg: #181a1f;
            --text-main: #ffffff;
            --text-muted: #9e9ea7;
            --border-color: #23262d;
            --accent-gold: #f59e0b;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 5%;
            border-bottom: 1px solid #111;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 700;
            text-decoration: none;
            color: #fff;
        }

        .navbar-brand img {
            width: 36px;
            height: 36px;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #fff;
        }

        /* User Dropdown */
        .user-dropdown-wrapper { position: relative; display: inline-block; }
        .user-dropdown-btn {
            background: transparent; border: none; color: #fff; font-family: inherit;
            font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center;
            gap: 8px; padding: 6px 12px; border-radius: 20px; transition: background 0.2s;
        }
        .user-dropdown-btn:hover { background: #1a1c21; }
        .user-dropdown-btn img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
        .user-dropdown-menu {
            position: absolute; top: 100%; right: 0; margin-top: 8px; background: #121316;
            border: 1px solid #23262d; border-radius: 12px; width: 180px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none; flex-direction: column; overflow: hidden; z-index: 100;
        }
        .user-dropdown-menu.show { display: flex; }
        .user-dropdown-menu a, .user-dropdown-menu button {
            padding: 10px 16px; color: #cccccc; text-decoration: none; font-size: 13px; background: none;
            border: none; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box;
        }
        .user-dropdown-menu a:hover, .user-dropdown-menu button:hover { background: #1f2229; color: #ffffff; }

        .auth-btn-group { display: flex; align-items: center; gap: 12px; }
        .btn-login { color: #fff; text-decoration: none; font-size: 14px; font-weight: 500; }
        .btn-register { background: #ffffff; color: #000000; padding: 6px 16px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: 600; }

        /* Container */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-header {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .page-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 8px 0;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }

        /* Bookmarks Grid */
        .bookmarks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
        }

        .bookmark-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .bookmark-card:hover {
            transform: translateY(-4px);
            border-color: #3b3e47;
        }

        .cover-wrapper {
            width: 100%;
            aspect-ratio: 2/3;
            overflow: hidden;
            background: #181a1f;
        }

        .cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: #fff;
            text-decoration: none;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-title:hover {
            color: var(--accent-gold);
        }

        .card-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .card-actions {
            margin-top: auto;
            display: flex;
            gap: 8px;
        }

        .btn-read {
            flex-grow: 1;
            background: #ffffff;
            color: #000000;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn-read:hover {
            opacity: 0.9;
        }

        .btn-remove {
            background: #181a1f;
            border: 1px solid var(--border-color);
            color: #ef4444;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }

        .btn-remove:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        .empty-state h3 {
            font-size: 18px;
            margin: 0 0 8px 0;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-explore {
            background: #ffffff;
            color: #000000;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <a href="index.html" class="navbar-brand">
            <img src="images/logo.png" alt="Lazy Mochi">
            <span>Lazy Mochi</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="novels.html">Novels</a></li>
            <li><a href="genres.html">Genres</a></li>
            <li><a href="latest.html">Latest</a></li>
            <li><a href="bookmarks.html" class="active">Bookmarks</a></li>
        </ul>
        <div class="navbar-right" id="navAuthArea">
            <span style="font-size: 13px; color: #777;">Loading...</span>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1>My Bookmarks</h1>
            <p>Your saved list of novels to read later.</p>
        </div>

        <div class="bookmarks-grid" id="bookmarksGrid">
            <div class="empty-state">
                <p>Loading bookmarks...</p>
            </div>
        </div>
    </div>

    <script type="module" src="js/bookmarks.js"></script>
</body>

</html>
